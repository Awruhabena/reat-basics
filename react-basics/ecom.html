  <!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ProductionDetails({item , price , discountPrice, imageSrc}){
            return(
                <div> 
                    
                   <img src = {imageSrc} width="150px"></img>
                    
                    <p>{item}</p>
                    {discountPrice ? 
                        <p><del>Price : {price}</del></p>
                        : 
                        <p>Price : {price}</p> 
                    }
                    
                    {discountPrice && (
                       <p>Discount : {discountPrice}</p>
                    )}

                    <div>
                        <button>Add to Cart</button>
                    </div>

                </div>
            )
           
        }

        /*{discountPrice && (
                       <p><del>Price : {price}</del></p>
                    )}

                    {!discountPrice && (
                       <p>Price : {price}</p>
                    )}*/
         
      function App(){
        return(
            <>
                <ProductionDetails imageSrc = "cotton-socks.png" item = "Cotton socks" price = "$10.90" discountPrice = "$5.45"/>
                <ProductionDetails imageSrc = "tennis-balls.png" item = "Tennis balls" price = "$6.00"/>
                <ProductionDetails imageSrc = "plain-t-shirt.png" item = "Plain T-Shirt" price = "$7.99"/>
                
            </>
        )
        
      }


      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
