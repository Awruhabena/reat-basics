<!DOCTYPE html>
<html>
  <head>
    <title>Chat Bot</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button{
        background-color: rgb(25,135,84 ); 
        color: white;
        padding:12px 20px;
        margin-left:10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      
      .search-box{
        border-radius: 10px;
        padding: 12px 15px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;

      }

      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display:flex;
        flex-direction: column;
        

      }

      .chat-message-user{
        display:flex;
        justify-content: end ;
        align-items: start;
      }

      .chat-message-robot{
        display: flex;
        align-items: start;
        
      }

      .chat-message-text{
        background-color: rgb(238 , 238, 238 );
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-image-user{
        width: 45px;
      }

      .chat-image-robot{
        width: 45px;
      }

      .chat-message-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script> 
    <script type="text/babel">
     //Creating Components
      function ChatInput({chatMessages , setChatMessages}){
        const [inputText , setInputText] = React.useState('');

        function saveInputText(event){
          setInputText(event.target.value);
        }

        function sendMessage(){
          const newChatMessages = [
            ...chatMessages,
            {
              id :crypto.randomUUID(),
              message:inputText,
              sender : 'user'

            }
          ];
          setChatMessages(newChatMessages);

          const reponse = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              id :crypto.randomUUID(),
              message:reponse,
              sender : 'robot'

            }
          ]);

          setInputText('');

        }

        return(
  
          <div className = "chat-input-container">
            <input 
              placeholder = "Send a message to chatbot" 
              size = "30"
              onChange ={saveInputText}
              value = {inputText}
              className = "search-box"
            />

            <button onClick={sendMessage} className = "send-button">Send</button>
          </div>
        );
      }

      function ChatMessage({message,sender}){
        //const message = props.message;
        //const sender  = props.sender;
        //const {message,sender} = props;

        /*if(sender === 'robot'){
          return(
            <div> 
              <img src="robot.png" width ="50px"/>
              {message}
              
           </div>
          )
        }*/

        
        
        //If statements in JSX
        return(
          <div className = {
            sender === 'user' 
              ? 'chat-message-user' 
              : 'chat-message-robot'
          }> 
            {sender === 'robot'&& (
              <img src="robot.png"className = 'chat-image-robot'/>
            )}
            <div className='chat-message-text'>
              {message}
            </div>
            

            {sender ==='user' && (
              <img src="user.png" className = 'chat-image-user'/>
            )} 
          </div>
        )
      }

      
      function ChatMessages ({chatMessages}){
       const chatMessagesRef =  React.useRef(null);
       
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current; //contains HTML element
          if (containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        },[chatMessages]);

        return(
          <div className='chat-message-container' ref={chatMessagesRef}>
            
            {chatMessages.map((chatMessage) => {
              return(
                <ChatMessage 
                  message = {chatMessage.message}
                  sender = {chatMessage.sender}
                  key = {chatMessage.id}
                />
              );
            })}
          </div>


        )
      }
      
      function App(){

        const[chatMessages, setChatMessages] = React.useState ([
          {
            id : 'id1',
            message : 'Hello chatbot',
            sender : 'user'
          } ,
          {
            id : 'id2',
            message : 'Hello!. How can I help you',
            sender : 'robot'
          },
          {
            id : 'id3',
            message : "Can you get me today's date",
            sender : 'user'
          },
          {
            id : 'id4',
            message : 'Today is September 27',
            sender : 'robot'
          }
        
        
        ]);
        //const [chatMessages , setChatmessagesa] = array;
       // const chatMessages = array[0];
        //const setChatMessages = array [1];
      
        return(
          <div className = "app-container">
            
            <ChatMessages 
            chatMessages = {chatMessages} />
            <ChatInput 
              chatMessages={chatMessages} 
              setChatMessages={setChatMessages}>
            </ChatInput>
            
          </div>
        )
      }




      
      
      
      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);

      
      
    </script>
  </body>
</html>
